<script>
class Component extends DCLogic {
  setBtn(v) {
    // the review toggle; boards of the same lane stay in step through a broadcast channel
    this.setState({ btn: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ btn: v }); } catch (e) {}
  }
  listenBtn() {
    try {
      this.btnChannel = new BroadcastChannel('mission-buttons-lane-g3');
      this.btnChannel.onmessage = (e) => { if (e.data && e.data.btn) this.setState({ btn: e.data.btn }); };
    } catch (e) {}
  }
  svcGo(d) {
    const i = Math.max(0, Math.min(4, ((this.state && this.state.svc) || 0) + d));
    this.setState({ svc: i });
  }
  svcVals() {
    const i = (this.state && this.state.svc) || 0;
    return {
      svcTrack: 'display: flex; gap: 12px; transform: translateX(-' + (i * 290) + 'px); transition: transform .6s cubic-bezier(.22,.61,.36,1)',
      svcPrevCls: 'car-btn' + (i === 0 ? ' is-off' : ''),
      svcNextCls: 'car-btn' + (i === 4 ? ' is-off' : ''),
      svcPrev: this.svcPrevFn || (this.svcPrevFn = () => this.svcGo(-1)),
      svcNext: this.svcNextFn || (this.svcNextFn = () => this.svcGo(1)),
    };
  }
  renderVals() {
    return {
      ...this.svcVals(),
      btnMode: (this.state && this.state.btn) || 'green',
      isBlue: ((this.state && this.state.btn) || 'green') === 'blue' ? 'true' : 'false',
      isGreen: ((this.state && this.state.btn) || 'green') === 'green' ? 'true' : 'false',
      setBlue: this.setBlue || (this.setBlue = () => this.setBtn('blue')),
      setGreen: this.setGreen || (this.setGreen = () => this.setBtn('green')),
    };
  }
  componentDidMount() {
    this.listenBtn();
  }
  componentWillUnmount() {
    try { if (this.btnChannel) this.btnChannel.close(); } catch (e) {}
  }
}
DC.boot(Component);
</script>
