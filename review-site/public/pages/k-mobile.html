<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Lane K homepage, mobile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#061428}
.lk{font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#C9D6E8;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6}
.lk *{box-sizing:border-box}
.lk a{color:inherit}
.lk h1,.lk h2,.lk h3,.lk .cond{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.94}
.lk p{margin:0}
.lk .eb{display:flex;align-items:center;gap:14px;font:700 12px/1.3 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#1FA2FF}
.lk .eb::after{content:'';flex:none;width:56px;height:12px;
  background:radial-gradient(circle,#FFFFFF 0 1.2px,#FFD98A 2px,rgba(255,150,40,.55) 3.4px,rgba(255,150,40,0) 6px) no-repeat,
             linear-gradient(90deg,rgba(255,170,70,.0),rgba(255,170,70,.9)) no-repeat,
             linear-gradient(currentColor,currentColor) no-repeat;
  background-size:12px 12px,10px 2px,89% 2px;background-position:100% 50%,87% 50%,0 50%;
  animation:kFuse 5.2s linear infinite,kSpark .18s steps(2) infinite alternate}
/* the eyebrow line is a lit fuse (13 Nov, by request, kept subtle): a small spark burns along the line toward the words, the cord
   shortening behind it with a warm glow at the tip, then the line comes back and it starts again */
@keyframes kFuse{
  0%{background-size:12px 12px,10px 2px,89% 2px;background-position:100% 50%,87% 50%,0 50%;opacity:.85}
  60%{background-size:12px 12px,10px 2px,11% 2px;background-position:0 50%,-9% 50%,0 50%;opacity:.85}
  66%{background-size:0 0,0 2px,0 2px;background-position:0 50%,-9% 50%,0 50%;opacity:0}
  78%{background-size:0 0,0 2px,89% 2px;background-position:100% 50%,87% 50%,0 50%;opacity:0}
  88%,100%{background-size:12px 12px,10px 2px,89% 2px;background-position:100% 50%,87% 50%,0 50%;opacity:.85}}
@keyframes kSpark{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.lk .eb.c::after{display:none}
.lk .dk{color:#C9D6E8}
.lk .dk h1,.lk .dk h2,.lk .dk h3{color:#FFFFFF}
.lk .lt{color:#4A5A70}
.lk .lt h2,.lk .lt h3{color:#0A1B2E}
.lk .blue{color:#1FA2FF !important}
/* buttons: lime, crisp corners; outlined buttons fill with lime on hover (as on Lane J) */
.lk .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:4px;border:1px solid #C1F432;background:#C1F432;color:#061428;font:700 15px/1 'Inter',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .4s cubic-bezier(.22,.61,.36,1),background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease}
.lk .btn:hover,.lk .btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(193,244,50,.28)}
.lk .btn .ar{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.lk .btn:hover .ar{transform:translateX(3px)}
.lk .btn-o{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.55)}
.lk .btn-o:hover,.lk .btn-o:focus-visible{background:#C1F432;color:#061428;border-color:#C1F432}
.lk .lt .btn-o{color:#0A1B2E;border-color:#9FB0C4}
.lk .lt .btn-o:hover,.lk .lt .btn-o:focus-visible{color:#061428;border-color:#C1F432}
.lk .nl-field:focus-within{border-color:rgba(255,255,255,.6) !important;background:rgba(255,255,255,.1) !important}
.lk .nl-field input::placeholder{color:#8496AD}
/* text links: the lime square wipe, left to right, the words inking dark as it reaches them */
.lk .lw{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;cursor:pointer}
.lk .lw::before{content:'';position:absolute;top:-5px;bottom:-5px;left:-8px;right:-8px;z-index:-1;background:#C1F432;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
.lk .lw:hover::before,.lk .lw:focus-visible::before{transform:scaleX(1)}
.lk .lw{transition:color .2s ease .15s}
.lk .lw:hover,.lk .lw:focus-visible{color:#101419 !important}
/* cards */
.lk .card{background:#FFFFFF;border-radius:6px;box-shadow:0 18px 40px rgba(4,16,34,.22);transition:transform .3s ease,box-shadow .3s ease;cursor:pointer;text-decoration:none;color:#4A5A70}
.lk .card:hover{transform:translateY(-5px);box-shadow:0 26px 54px rgba(4,16,34,.3)}
.lk .card h3{color:#0A1B2E}
.lk .card .go{color:#0A1B2E;transition:transform .3s ease,color .3s ease}
.lk .card:hover .go{transform:translateX(4px);color:#1FA2FF}
.lk .card img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lk .card:hover img{transform:scale(1.05)}
.lk .nav a{color:#FFFFFF;text-decoration:none;font:500 14px/1 'Inter',sans-serif;display:inline-flex;align-items:center;gap:4px;transition:color .2s ease}
.lk .nav a:hover{color:#C1F432}
.lk .foot a:not(.btn){color:#AEBCCD;text-decoration:none;transition:color .2s ease}
.lk .foot a:not(.btn):hover{color:#C1F432}
.lk .faq{display:flex;align-items:center;gap:14px;padding:16px 4px;border-top:1px solid #D9E2EC;font-weight:600;color:#0A1B2E;cursor:pointer}
.lk .faq svg{color:#1FA2FF;flex:none;transition:transform .25s ease}
.lk .faq:hover svg{transform:rotate(90deg)}
.lk .ph{position:relative;overflow:hidden}
.lk .ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lk .slash{position:absolute;background:#1FA2FF;transform:skewX(-5deg)}
.lk .cursor{cursor:pointer}
/* case studies (13 Nov): slanted cards with a glowing edge; the highlighted one (arrows and dots) glows brighter and lifts */
/* the slant was reduced twice on 13 Nov, by request (14 to 7 to 4 degrees on desktop, 8 to 4 to 2 on mobile) */
.lk .k-cs-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;padding:12px 24px}
.lk .k-cs{display:block;text-decoration:none;transform:skewX(-4deg);border:1.5px solid rgba(31,162,255,.55);border-radius:4px;background:#0A2240;overflow:hidden;
  box-shadow:0 0 0 rgba(31,162,255,0);transition:transform .45s cubic-bezier(.22,.61,.36,1),box-shadow .45s ease,border-color .45s ease}
.lk .k-cs-in{transform:skewX(4deg);margin:0 -13px;position:relative}
.lk .k-cs-ph{position:relative;height:230px;overflow:hidden}
.lk .k-cs-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.22,.61,.36,1)}
.lk .k-cs-ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,34,64,0) 30%,#0A2240 100%)}
.lk .k-cs-body{position:relative;margin-top:-56px;padding:0 54px 28px 42px;display:flex;flex-direction:column;gap:10px}
.lk .k-cs-t{font-family:'Inter',sans-serif !important;font-style:italic !important;text-transform:none !important;font-weight:800 !important;font-size:23px !important;line-height:1.15 !important;letter-spacing:-.02em !important;color:#FFFFFF}
.lk .k-cs-go{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font:700 14.5px/1 'Inter',sans-serif;color:#C1F432}
.lk .k-cs-go svg{transition:transform .3s ease}
.lk .k-cs:hover,.lk .k-cs:focus-visible{border-color:#4FC3FF;box-shadow:0 0 0 1px rgba(79,195,255,.6),0 0 26px rgba(31,162,255,.55),0 0 60px rgba(31,162,255,.25)}
.lk .k-cs:hover,.lk .k-cs:focus-visible{transform:skewX(-4deg) translateY(-10px)}
/* desktop shows all three cards, so the arrows and dots are for mobile only (13 Nov: no card looks hovered until it is) */
.lk .k-cs-navbar{display:none !important}
.lk .k-cs:hover .k-cs-ph img{transform:scale(1.06)}
.lk .k-cs:hover .k-cs-go svg{transform:translateX(4px)}
.lk .k-cs-nav{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;border:2px solid #FFFFFF;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;transition:background-color .25s ease,color .25s ease,border-color .25s ease}
.lk .k-cs-nav:hover,.lk .k-cs-nav:focus-visible{background:#C1F432;border-color:#C1F432;color:#061428}
.lk .k-cs-dot{all:unset;cursor:pointer;width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35);transition:background-color .25s ease,transform .25s ease}
.lk .k-cs-dot[aria-pressed="true"]{background:#1FA2FF;transform:scale(1.15)}
@media (max-width: 600px){
  .lk .k-cs-row{grid-template-columns:1fr;padding:12px 22px}
  .lk .k-cs{transform:skewX(-2deg)}
  .lk .k-cs-in{transform:skewX(2deg);margin:0 -8px}
  .lk .k-cs-body{padding:0 28px 24px}
  .lk .k-cs[data-on="false"]{display:none}
  .lk .k-cs:hover,.lk .k-cs:focus-visible{transform:skewX(-2deg)}
  .lk[data-angles="off"] .k-cs:hover,.lk[data-angles="off"] .k-cs:focus-visible{transform:none !important}
  .lk .k-cs-navbar{display:flex !important}
  .lk .k-cs-ph{height:200px}
}
.lk .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* the badge marquee: two copies of the row, the track slides left by one copy and loops */
@keyframes kMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lk .k-track{animation:kMarquee 34s linear infinite}
.lk .k-marquee:hover .k-track{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.lk *{transition:none !important}}
/* review bar (not part of the design) and its two switches (13 Nov, by request) */
.lk .tg-bar{position:sticky;top:0;z-index:100;min-height:40px;box-sizing:border-box;background:#141414;color:#FFFFFF;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:6px 8px;font:500 12.5px/1 system-ui,-apple-system,'Segoe UI',sans-serif}
.lk .tg-bar .tg-label{color:#BDBDBD}
.lk .tg-bar .tg-group{display:inline-flex;background:#2B2B2B;border-radius:999px;padding:3px;gap:2px}
.lk .tg-bar .tg-opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;color:#D0D0D0;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;transition:background-color .2s ease,color .2s ease}
.lk .tg-bar .tg-opt:hover{color:#FFFFFF}
.lk .tg-bar .tg-opt:focus-visible{outline:2px solid #1FA2FF;outline-offset:2px}
.lk .tg-bar .tg-opt[aria-pressed="true"]{background:#FFFFFF;color:#141414}
/* Angles off: straight case-study cards, a square mission photo and upright bars on the headshot frames (the italic headings stay) */
.lk[data-angles="off"] .k-cs,.lk[data-angles="off"] .k-cs-in{transform:none !important}
.lk[data-angles="off"] .k-cs-in{margin:0 !important}
.lk[data-angles="off"] .k-cs-body{padding:0 28px 28px !important}
.lk[data-angles="off"] .k-cs:hover,.lk[data-angles="off"] .k-cs:focus-visible{transform:translateY(-10px) !important}
.lk[data-angles="off"] .k-ang-clip{clip-path:none !important}
.lk[data-angles="off"] .slash{transform:none}
/* Eyebrow lines None: no line or fuse after the eyebrows */
.lk[data-eb="none"] .eb::after{display:none}
/* Copy: Standard is the sourced copy; Mission puts headings, eyebrows and short lines in a spy-mission voice (same facts) */
.lk[data-copy="mission"] .cp-s,.lk[data-copy="standard"] .cp-m{display:none}
@media (prefers-reduced-motion: reduce){.lk .k-track{animation:none}.lk .eb::after{animation:none;background:linear-gradient(currentColor,currentColor) no-repeat 0 50%/100% 2px}}
.lk .k-sv-track{display:flex;align-items:stretch;gap:14px;transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lk .k-sv-track>.card{flex:none;width:86%}
.lk .k-sv-track[data-pos="1"]{transform:translateX(calc(calc(86% + 14px) * -1))}
.lk .k-sv-track[data-pos="2"]{transform:translateX(calc(calc(86% + 14px) * -2))}
.lk .k-sv-track[data-pos="3"]{transform:translateX(calc(calc(86% + 14px) * -3))}
.lk .k-sv-track[data-pos="4"]{transform:translateX(calc(calc(86% + 14px) * -4))}
.lk .k-sv-track[data-pos="5"]{transform:translateX(calc(calc(86% + 14px) * -5))}
.lk .k-sv-track[data-pos="6"]{transform:translateX(calc(calc(86% + 14px) * -6))}
</style>

<style>html,body{margin:0;overflow-x:clip}#dc-root{overflow-x:clip}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="lk" data-angles="{{ angMode }}" data-eb="{{ ebMode }}" data-copy="{{ copyMode }}" style="width: 390px; background: #061428">
<div class="tg-bar" aria-label="Review control, not part of the design"><span class="tg-label">Review ·</span><span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Angles</span><span class="tg-group" role="group" aria-label="Angles"><button type="button" class="tg-opt" aria-pressed="{{ isAngOn }}" onClick="{{ setAngOn }}">On</button><button type="button" class="tg-opt" aria-pressed="{{ isAngOff }}" onClick="{{ setAngOff }}">Off</button></span></span><span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Eyebrow lines</span><span class="tg-group" role="group" aria-label="Eyebrow lines"><button type="button" class="tg-opt" aria-pressed="{{ isEbFuse }}" onClick="{{ setEbFuse }}">Fuse</button><button type="button" class="tg-opt" aria-pressed="{{ isEbNone }}" onClick="{{ setEbNone }}">None</button></span></span><span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Copy</span><span class="tg-group" role="group" aria-label="Copy"><button type="button" class="tg-opt" aria-pressed="{{ isCopyStd }}" onClick="{{ setCopyStd }}">Standard</button><button type="button" class="tg-opt" aria-pressed="{{ isCopyMis }}" onClick="{{ setCopyMis }}">Mission</button></span></span></div>
<!-- 01 Hero: the photo behind, the headline on the left, the five facts along the bottom -->
<section class="dk" aria-label="Hero" style="position: relative; overflow: hidden; background: #061428">
<div class="ph" aria-hidden="true" style="position: absolute; inset: 0"><img src="../img/8dcb3de219da9fe675e8e0f20be57256.webp" alt="" style="object-position: 68% 40%"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,20,40,.82) 0%, rgba(6,20,40,.70) 55%, rgba(6,20,40,.95) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, rgba(6,20,40,.92) 0%, rgba(6,20,40,.78) 45%, rgba(6,20,40,0) 100%)"></div>
<div style="position: relative; z-index: 2; margin: 0 auto; padding: 0 20px; padding-bottom: 64px"><header style="display: flex; align-items: center; justify-content: space-between; height: 72px"><a href="#top" aria-label="MISSION home" style="display: flex"><img src="../img/b29865f8838e8d694583c88108f0c2aa.svg" alt="MISSION" style="height: 22px; width: auto; display: block"></a><div style="display: flex; gap: 8px"><a class="btn" href="#schedule" style="height: 40px; padding: 0 14px; font-size: 13.5px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>Schedule</a><button type="button" aria-label="Open menu" class="cursor" style="all: unset; cursor: pointer; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; color: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div></header><div id="top" style="display: flex; flex-direction: column; gap: 20px; max-width: 100%; padding: 44px 0 0"><p class="eb c" style="color: #FFFFFF; letter-spacing: .12em; font-size: 10.5px">Bookkeeping / Accounting / QuickBooks / Fractional CFO</p><h1 style="font-size: 52px; color: #FFFFFF"><span class="cp-s">Complex books.<br><span class="blue">Clear answers.</span></span><span class="cp-m">Complex books?<br><span class="blue">Mission accepted.</span></span></h1><p style="font-size: 16px; line-height: 1.6; color: #DCE6F2; max-width: 560px">We sort out complex books, keep them right every month, and show you your numbers in plain words. You get to focus on running your business.</p><div style="display: flex; flex-direction: column; gap: 12px; padding-top: 6px"><a class="btn" href="#schedule" style="width: 100%"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>Schedule a free consultation</a><a class="btn btn-o" href="#case-studies" style="width: 100%">Read client stories<span class="ar" style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div></div>
</section>

<!-- 02 The mission: a specialist team, with the team photo in a slanted frame -->
<section id="who-we-are" class="lt" aria-label="The mission" style="position: relative; overflow: hidden; background: linear-gradient(180deg, #F4F8FC 0%, #EDF3F9 100%); padding: 64px 0">
<div style="position: relative; z-index: 2; margin: 0 auto; padding: 0 20px"><div style="display: flex; flex-direction: column; gap: 36px; align-items: stretch"><div style="display: flex; flex-direction: column; gap: 22px"><p class="eb"><span class="cp-s">The mission</span><span class="cp-m">Your briefing</span></p><h2 style="font-size: 46px"><span class="cp-s">A specialist team that knows your business.</span><span class="cp-m">A specialist team, briefed on your business.</span></h2><p style="font-size: 17px; max-width: 470px">You started a business, not a bookkeeping job. We keep your books clean and correct. You don't have to hire a full finance team or get lost at a big firm.</p><div style="padding-top: 6px"><a class="btn" href="#schedule" style="width: 100%">Let's talk about your needs<span class="ar" style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div><div style="position: relative; height: 300px"><div class="ph k-ang-clip" style="position: absolute; inset: 0; clip-path: polygon(2.5% 0, 100% 0, 100% 100%, 0 100%)"><img src="../img/fffa2c71ba1ad1c02f0d03a0cc647d85.webp" alt="Specialists reviewing a client's numbers together" style="object-position: center 30%"></div></div></div></div>
</section>

<!-- 05 Case studies: the real stories, on the contour-line texture -->
<section id="case-studies" class="dk" aria-label="Case studies" style="position: relative; overflow: hidden; background: #0A2240; padding: 64px 0">
<div style="position: relative; z-index: 2; margin: 0 auto; padding: 0 20px"><div style="display: flex; flex-direction: column; gap: 22px; align-items: stretch; margin-bottom: 36px"><div style="display: flex; flex-direction: column; gap: 20px"><p class="eb"><span class="cp-s">Case studies</span><span class="cp-m">Case files</span></p><h2 style="font-size: 50px"><span class="cp-s">Real problems.<br><span class="blue">Real progress.</span></span><span class="cp-m">Real cases.<br><span class="blue">Real results.</span></span></h2></div><div style="display: flex; flex-direction: column; gap: 20px; "><p style="font-size: 17px; color: #DCE6F2; max-width: 420px"><span class="cp-s">Complex books, sorted. These are real MISSION clients and what changed for them.</span><span class="cp-m">Complex books, cleared. These are real MISSION clients and what changed for them.</span></p><div><a class="btn" href="#case-studies" style="width: 100%">See all case studies<span class="ar" style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div></div><div class="k-cs-row"><a class="k-cs" data-on="{{ csOn0 }}" href="https://missionaccountinghelp.com/customers/quickbooks-enterprise-support" target="_blank" rel="noopener"><div class="k-cs-in"><div class="k-cs-ph"><img src="../img/dfd86de5e4c6c2aa6ee6ec5df6d9d9d0.webp" alt="" style="object-position: 55% 28%"></div><div class="k-cs-body"><span style="display: inline-flex; align-items: center; gap: 10px; font: 700 12px/1 'Inter', sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5M4 5h16M4 5l5 5M14 5v4M12 9h4v3h-4zM2 21h6M8 5V3"/></svg>Constru o; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#setup" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">QuickBooks Setup & Advisory</h3><p style="font-size: 14.5px; line-height: 1.55">Set up right, then put to good use. Once your books are clean, we help you use the numbers to make better choices.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#cfo" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M6 16v-4M10 16V9M14 16v-6M18 16V5"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Fractional CFO</h3><p style="font-size: 14.5px; line-height: 1.55">A part-time finance chief for your business, without hiring one full-time. Our managing partner leads this.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#cleanup" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 21v-5h-5"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">QuickBooks Cleanup</h3><p style="font-size: 14.5px; line-height: 1.55">Months of bank statements nobody has matched to the books, or books left behind when a bookkeeper moved on. We bring them up to date and make them right.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#pos" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">POS Integration</h3><p style="font-size: 14.5px; line-height: 1.55">We connect your checkout system, like Square or Shopify, to QuickBooks so your sales show up in your books on their own.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#reporting" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V14M9 20V10M14 20V6M19 20V3"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Custom Reporting</h3><p style="font-size: 14.5px; line-height: 1.55">Normal reports answer your accountant's questions. Custom reports answer yours.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#products" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; min-height: auto"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing:
