<style>
.lk{font-family:'Inter','Helvetica Neue',Arial,sans-serif;color:#C9D6E8;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6}
.lk *{box-sizing:border-box}
.lk a{color:inherit}
.lk h1,.lk h2,.lk h3,.lk .cond{margin:0;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.94}
.lk p{margin:0}
.lk .eb{display:flex;align-items:center;gap:14px;font:700 12px/1.3 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#1FA2FF}
.lk .eb::after{content:'';width:44px;height:2px;background:currentColor;opacity:.8}
.lk .eb.c::after{display:none}
.lk .dk{color:#C9D6E8}
.lk .dk h1,.lk .dk h2,.lk .dk h3{color:#FFFFFF}
.lk .lt{color:#4A5A70}
.lk .lt h2,.lk .lt h3{color:#0A1B2E}
.lk .blue{color:#1FA2FF !important}
/* buttons: lime, crisp corners; outlined buttons fill with lime on hover (as on Lane J) */
.lk .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:4px;border:1px solid #C1F432;background:#C1F432;color:#061428;font:700 15px/1 'Inter',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .4s cubic-bezier(.22,.61,.36,1),background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease}
.lk .btn:hover,.lk .btn:focus-visible{transform:translateY(-2px);box-shadow:0 10px 24px rgba(193,244,50,.28)}
.lk .btn .ar{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.lk .btn:hover .ar{transform:translateX(3px)}
.lk .btn-o{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.55)}
.lk .btn-o:hover,.lk .btn-o:focus-visible{background:#C1F432;color:#061428;border-color:#C1F432}
/* text links: the lime square wipe, left to right, the words inking dark as it reaches them */
.lk .lw{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;cursor:pointer}
.lk .lw::before{content:'';position:absolute;top:-5px;bottom:-5px;left:-8px;right:-8px;z-index:-1;background:#C1F432;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
.lk .lw:hover::before,.lk .lw:focus-visible::before{transform:scaleX(1)}
.lk .lw{transition:color .2s ease .15s}
.lk .lw:hover,.lk .lw:focus-visible{color:#101419 !important}
/* cards */
.lk .card{background:#FFFFFF;border-radius:6px;box-shadow:0 18px 40px rgba(4,16,34,.22);transition:transform .3s ease,box-shadow .3s ease;cursor:pointer;text-decoration:none;color:#4A5A70}
.lk .card:hover{transform:translateY(-5px);box-shadow:0 26px 54px rgba(4,16,34,.3)}
.lk .card h3{color:#0A1B2E}
.lk .card .go{color:#0A1B2E;transition:transform .3s ease,color .3s ease}
.lk .card:hover .go{transform:translateX(4px);color:#1FA2FF}
.lk .card img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lk .card:hover img{transform:scale(1.05)}
.lk .nav a{color:#FFFFFF;text-decoration:none;font:500 14px/1 'Inter',sans-serif;display:inline-flex;align-items:center;gap:4px;transition:color .2s ease}
.lk .nav a:hover{color:#C1F432}
.lk .foot a:not(.btn){color:#AEBCCD;text-decoration:none;transition:color .2s ease}
.lk .foot a:not(.btn):hover{color:#C1F432}
.lk .faq{display:flex;align-items:center;gap:14px;padding:16px 4px;border-top:1px solid #D9E2EC;font-weight:600;color:#0A1B2E;cursor:pointer}
.lk .faq svg{color:#1FA2FF;flex:none;transition:transform .25s ease}
.lk .faq:hover svg{transform:rotate(90deg)}
.lk .ph{position:relative;overflow:hidden}
.lk .ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lk .slash{position:absolute;background:#1FA2FF;transform:skewX(-18deg)}
.lk .cursor{cursor:pointer}
@media (prefers-reduced-motion: reduce){.lk *{transition:none !important}}
</style>

.7 2z"/></svg>(203) 227-9475</a><a class="btn" href="#schedule" style="height: 44px; padding: 0 18px; font-size: 14px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>Schedule a free consultation</a></div></header><div id="top" style="display: flex; flex-direction: column; gap: 24px; max-width: 720px; padding: 96px 0 0"><p class="eb c" style="color: #FFFFFF; letter-spacing: .2em; font-size: 12px">Bookkeeping / Accounting / QuickBooks / Fractional CFO</p><h1 style="font-size: 112px; color: #FFFFFF">Complex books.<br><span class="blue">Clear answers.</span></h1><p style="font-size: 18px; line-height: 1.6; color: #DCE6F2; max-width: 560px">We fix messy books, keep them right every month, and show you your numbers in plain words. You get to focus on running your business.</p><div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 6px"><a class="btn" href="#schedule"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>Schedule a free consultation</a><a class="btn btn-o" href="#case-studies">Read client stories<span class="ar" style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div><div style="margin-top: 92px; border-top: 1px solid rgba(255,255,255,.16); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))"><div style="display: flex; align-items: center; gap: 14px; padding: 26px 0; "><span style="color: #1FA2FF; flex: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="cond" style="font-size: 34px; color: #FFFFFF">25+</span><span style="font-size: 13.5px; color: #AFC0D4">Years in business</span></span></div><div style="display: flex; align-items: center; gap: 14px; padding: 26px 0; border-left: 1px solid rgba(255,255,255,.14); padding-left: 28px"><span style="color: #1FA2FF; flex: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15.5 4.65a3.5 3.5 0 0 1 0 6.7"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="cond" style="font-size: 34px; color: #FFFFFF">850</span><span style="font-size: 13.5px; color: #AFC0D4">Clients served</span></span></div><div style="display: flex; align-items: center; gap: 14px; padding: 26px 0; border-left: 1px solid rgba(255,255,255,.14); padding-left: 28px"><span style="color: #1FA2FF; flex: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V14M9 20V10M14 20V6M19 20V3"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="cond" style="font-size: 34px; color: #FFFFFF">100–140</span><span style="font-size: 13.5px; color: #AFC0D4">Clients a year</span></span></div><div style="display: flex; align-items: center; gap: 14px; padding: 26px 0; border-left: 1px solid rgba(255,255,255,.14); padding-left: 28px"><span style="color: #1FA2FF; flex: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 21v-5h-5"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="cond" style="font-size: 34px; color: #FFFFFF">50</span><span style="font-size: 13.5px; color: #AFC0D4">Recurring clients</span></span></div><div style="display: flex; align-items: center; gap: 14px; padding: 26px 0; border-left: 1px solid rgba(255,255,255,.14); padding-left: 28px"><span style="color: #1FA2FF; flex: none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><span style="display: flex; flex-direction: column; gap: 2px"><span class="cond" style="font-size: 34px; color: #FFFFFF">80%</span><span style="font-size: 13.5px; color: #AFC0D4">Come by referral</span></span></div></div></div>

<!-- 02 The mission: a specialist team, with the team photo in a slanted frame -->
<section id="who-we-are" class="lt" aria-label="The mission" style="position: relative; overflow: hidden; background: linear-gradient(180deg, #F4F8FC 0%, #EDF3F9 100%); padding: 110px 0">
<div style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 0 40px"><div style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center"><div style="display: flex; flex-direction: column; gap: 22px"><p class="eb">The mission</p><h2 style="font-size: 72px">A specialist team that knows your business.</h2><p style="font-size: 17px; max-width: 470px">You started a business, not a bookkeeping job. We keep your books clean and correct. You don't have to hire a full finance team or get lost at a big firm.</p><div style="padding-top: 6px"><a class="btn" href="#schedule">Let's talk about your needs<span class="ar" style="display: inline-flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div><div style="position: relative; height: 470px"><div class="ph" style="position: absolute; inset: 0; clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%)"><img src="../img/fffa2c71ba1ad1c02f0d03a0cc647d85.webp" alt="Specialists reviewing a client's numbers together" style="object-position: center 30%"></div><div class="slash" aria-hidden="true" style="left: 2%; top: 0; bottom: 0; width: 16px"></div></div></div></div>
</section>

<!-- 03 Services: four cards on navy, the photo fading in from the right -->
<section id="services" class="dk" aria-label="Services" style="position: relative; overflow: hidden; background: #061428; padding: 100px 0 110px">
<div class="ph" aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; width: 62%"><img src="../img/c83f8b0698ce7879ae30780c584bcc65.webp" alt="" style="object-position: center 40%"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, #061428 38%, rgba(6,20,40,.55) 70%, rgba(6,20,40,.35) 100%), linear-gradient(0deg, #061428 0%, rgba(6,20,40,0) 55%)"></div>
<div style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 0 40px"><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end; margin-bottom: 56px"><div style="display: flex; flex-direction: column; gap: 20px"><p class="eb">Our services</p><h2 style="font-size: 72px">Mission-critical<br>financial support.</h2></div><p style="font-size: 17px; max-width: 420px; color: #DCE6F2">A complete financial team for businesses that need more than basic bookkeeping.</p></div><div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px"><a class="card" href="#bookkeeping" style="display: flex; flex-direction: column; gap: 12px; padding: 28px 26px; min-height: 268px"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11v6M8 15h2M12 15h2"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Bookkeeping & Accounting</h3><p style="font-size: 14.5px; line-height: 1.55">Books that match your bank and that you can trust, kept by a team that knows QuickBooks inside out.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#setup" style="display: flex; flex-direction: column; gap: 12px; padding: 28px 26px; min-height: 268px"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">QuickBooks Setup & Advisory</h3><p style="font-size: 14.5px; line-height: 1.55">Set up right, then put to good use. Once your books are clean, we help you use the numbers to make better choices.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#cfo" style="display: flex; flex-direction: column; gap: 12px; padding: 28px 26px; min-height: 268px"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M6 16v-4M10 16V9M14 16v-6M18 16V5"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Fractional CFO</h3><p style="font-size: 14.5px; line-height: 1.55">A part-time finance chief for your business, without hiring one full-time. Our managing partner leads this.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a><a class="card" href="#cleanup" style="display: flex; flex-direction: column; gap: 12px; padding: 28px 26px; min-height: 268px"><span style="color: #1FA2FF"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></span><h3 style="font-family: 'Inter', sans-serif; font-style: normal; text-transform: none; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2">Additional support</h3><p style="font-size: 14.5px; line-height: 1.55">QuickBooks Cleanup, Custom Reporting and POS Integration, for when your books need more.</p><span class="go" style="margin-top: auto; display: inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a></div></div>
</section>

<!-- 04 Who we serve: who MISSION works with, from the Business DNA -->
