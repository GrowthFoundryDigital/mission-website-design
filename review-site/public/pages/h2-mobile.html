<style>

.lh .btn-p{background:#2459F5;color:#FFFFFF}

.lh .btn-o{background:transparent;color:#101419;border-color:#C9CED6}
.lh .btn-o:hover,.lh .btn-o:focus-visible{border-color:#101419}
.lh .dk .btn-o{color:#FFFFFF;border-color:rgba(255,255,255,.3)}
.lh .dk .btn-o:hover,.lh .dk .btn-o:focus-visible{border-color:#FFFFFF}

/* Geometry: decorative shapes sit behind content (z 0); section content sits above (z 1) */
.lh section,.lh footer{position:relative;overflow:hidden}

/* Review toggle: blue (#2459F5) or green (#C1F432) solid buttons */
.tg-bar{min-height:40px;box-sizing:border-box;background:#141414;color:#FFFFFF;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:6px 8px;font:500 12.5px/1 system-ui,-apple-system,'Segoe UI',sans-serif}

.tg-bar .tg-opt:focus-visible{outline:2px solid #8FAEFF;outline-offset:2px}
.tg-bar .tg-opt[aria-pressed="true"]{background:#FFFFFF;color:#141414}
.tg-bar .tg-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
[data-btn="green"] .tg-btn{background:#C1F432 !important;color:#101419 !important;border-color:#C1F432 !important}
[data-btn="green"] .tg-btn:hover,[data-btn="green"] .tg-btn:focus-visible{opacity:1}
/* Hovers (28 Oct): every button turns lime; cards lift */
.lh .btn{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease}
.lh .btn:hover,.lh .btn:focus-visible,[data-btn="green"] .lh .btn:hover,[data-btn="green"].lh .btn:hover,[data-btn="green"].lh .btn:focus-visible{background:#C1F432 !important;color:#101419 !important;border-color:#C1F432 !important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(193,244,50,.28)}
.lh .btn:hover *,.lh .btn:focus-visible *{color:#101419 !important}
.lh .card{transition:border-color .3s ease,transform .3s ease,box-shadow .3s ease}
.lh .card:hover,.lh a.card:focus-visible{border-color:#2459F5 !important;transform:translateY(-4px);box-shadow:0 18px 40px rgba(16,20,25,.10)}
.lh .feat{transition:transform .3s ease,box-shadow .3s ease}
.lh .feat img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lh .feat:hover,.lh .feat:focus-visible{transform:translateY(-4px);box-shadow:0 24px 50px rgba(16,20,25,.22)}
.lh .feat:hover img,.lh .feat:focus-visible img{transform:scale(1.04)}
.lh .qcard{transition:transform .3s ease,box-shadow .3s ease,background-color .3s ease}

.lh .qcard:not([style*="#2459F5"]):hover{background:#222833 !important}

.lh .post h3{transition:color .25s ease}
.lh .post:hover .ph img{transform:scale(1.05)}
.lh .post:hover h3{color:#2459F5}
/* Hover pack (28 Oct): FAQ, trigger rows, support items, dark list rows */
.lh .faq{transition:color .2s ease}
.lh .faq:hover,.lh .faq:focus-visible{color:#2459F5}
.lh .faq:hover svg{transform:rotate(90deg)}
.lh .faq[aria-expanded="true"]:hover svg{transform:rotate(45deg)}
.lh .hv-row{transition:transform .25s ease}
.lh .hv-row .ic{transition:transform .25s ease}
.lh .hv-row:hover{transform:translateX(8px)}
.lh .hv-row:hover .ic{transform:scale(1.15)}
.lh .hv-row:hover h3{color:#2459F5}
.lh .hv-sup{transition:border-color .25s ease,transform .25s ease}
.lh .hv-sup:hover{border-top-color:#2459F5 !important;transform:translateY(-3px)}
.lh .hv-sup:hover h3{color:#2459F5}
.lh .hv-li{transition:border-color .25s ease,color .25s ease}
.lh .hv-li .ic{transition:transform .25s ease}
.lh .hv-li:hover{border-top-color:#C1F432 !important}
.lh .hv-li:hover .ic{transform:translateX(4px);color:#C1F432}
.lh h3{transition:color .25s ease}
/* Buttons ease over 0.4s (28 Oct, by request) */
.lh .btn,[data-btn] .lh .tg-btn,[data-btn].lh .tg-btn{transition:transform .4s cubic-bezier(.22,.61,.36,1),background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease,filter .4s ease,opacity .4s ease !important}
.lh .btn .ar,.lh .lk .ar{transition:transform .4s cubic-bezier(.22,.61,.36,1) !important}
[data-btn="green"] .tg-btn *{color:#101419 !important}
</style>

</header>
<div class="deco dots on-dk" aria-hidden="true" style="right: 14px; top: 132px; width: 64px; height: 56px"></div>
<div id="top" style="position: relative; z-index: 2; padding: 36px 20px 0; display: flex; flex-direction: column; gap: 20px">
<p class="eb" style="letter-spacing: .16em">Practical. Reassuring. Experienced.</p>
<h1 style="font-size: 44px; line-height: 1; letter-spacing: -.035em">Complex books.<br>Clear answers.</h1>
<p style="font-size: 16.5px; line-height: 1.6; color: #EEF2FF">We fix messy books, keep them right every month, and show you your numbers in plain words. You get to focus on running your business.</p>
<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 6px"><a class="btn btn-p tg-btn" href="#schedule" style="width: 100%"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"></rect><path d="M16 2.5v4"></path><path d="M8 2.5v4"></path><path d="M3 10h18"></path></svg>Schedule a free consultation</a><a class="btn btn-o" href="#case-studies">Read client stories<svg class="ar" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: #EEF2FF"><span aria-hidden="true" style="display: inline-flex; align-items: center"><img src="../img/b0f8fafa98dcbe0082a836a30303b5e5.png" alt="" style="position: relative; z-index: 3; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #2459F5; margin-left: 0px"><img src="../img/8dcd87561fad4fb41686cffb42d245b4.png" alt="" style="position: relative; z-index: 2; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #2459F5; margin-left: -10px"><img src="../img/4a8aee7bf8f13bc1315ec9fa3aa9642d.png" alt="" style="position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #2459F5; margin-left: -10px"></span><span><strong style="color: #FFFFFF">5.0 average</strong> on Google reviews</span></div>

<!-- 02 Case studies lead the page: featured construction story, three story cards, a closing call -->
<section id="case-studies" aria-label="Case studies" class="ch" style="position: relative; padding: 52px 0">
<span class="deco" aria-hidden="true" style="right: 22px; top: 22px; width: 10px; height: 10px; box-sizing: border-box; background: #2459F5"></span><span class="deco" aria-hidden="true" style="right: 42px; top: 34px; width: 7px; height: 7px; box-sizing: border-box; background: #101419"></span><span class="deco" aria-hidden="true" style="right: 60px; top: 18px; width: 8px; height: 8px; box-sizing: border-box; border: 2px solid #2459F5"></span>
<svg class="deco" aria-hidden="true" width="120" height="120" viewBox="0 0 120 120" style="right: -46px; top: 640px; opacity: 0.4"><polygon points="26.82,0.75 119.25,0.75 119.25,119.25 0.75,119.25" fill="none" stroke="#2459F5" stroke-width="1.5"></polygon></svg>
<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 16px"><p class="eb"><span>Case studies</span></p><h2 style="font-size: 34px; line-height: 1.04">Real problems, Real solutions.</h2><p class="mu" style="font-size: 15.5px">Real stories from our blog. Each one shows the problem a business had and how we set up QuickBooks to fix it.</p></div>
<a class="feat" href="https://missionaccountinghelp.com/customers/quickbooks-enterprise-support" target="_blank" rel="noopener" style="display: flex; flex-direction: column; text-decoration: none; border-radius: 6px; overflow: hidden; background: #101419">
<div class="ph" style="height: 230px"><img src="../img/3554cab00abc02f5b19956702ff92a9f.webp" alt="A construction crew reviewing plans on a job site" style="object-position: center 40%"></div>

<script>
class Component extends DCLogic {
  setBtn(v) {
    // the review toggle; boards of the same lane stay in step through a broadcast channel
    this.setState({ btn: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ btn: v }); } catch (e) {}
  }
  setHero(v) {
    // the hero background toggle (kitchen, office or ecommerce photo), shared with the other Lane H2 board
    this.setState({ hero: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ hero: v }); } catch (e) {}
  }
  listenBtn() {
    try {
      this.btnChannel = new BroadcastChannel('mission-buttons-lane-h2');
      this.btnChannel.onmessage = (e) => {
        if (e.data && e.data.btn) this.setState({ btn: e.data.btn });
        if (e.data && e.data.hero) this.setState({ hero: e.data.hero });
      };
    } catch (e) {}
  }
  renderVals() {
    return {
      btnMode: (this.state && this.state.btn) || 'green',
      isBlue: ((this.state && this.state.btn) || 'green') === 'blue' ? 'true' : 'false',
      isGreen: ((this.state && this.state.btn) || 'green') === 'green' ? 'true' : 'false',
      setBlue: this.setBlue || (this.setBlue = () => this.setBtn('blue')),
      setGreen: this.setGreen || (this.setGreen = () => this.setBtn('green')),
      heroMode: (this.state && this.state.hero) || 'kitchen',
      isKitchen: ((this.state && this.state.hero) || 'kitchen') === 'kitchen' ? 'true' : 'false',
      isOffice: ((this.state && this.state.hero) || 'kitchen') === 'office' ? 'true' : 'false',
      isEcommerce: ((this.state && this.state.hero) || 'kitchen') === 'ecommerce' ? 'true' : 'false',
      setKitchen: this.setKitchen || (this.setKitchen = () => this.setHero('kitchen')),
      setOffice: this.setOffice || (this.setOffice = () => this.setHero('office')),
      setEcommerce: this.setEcommerce || (this.setEcommerce = () => this.setHero('ecommerce')),
    };
  }
  componentDidMount() {
    this.listenBtn();
  }
  componentWillUnmount() {
    try { if (this.btnChannel) this.btnChannel.close(); } catch (e) {}
  }
}
DC.boot(Component);
</script>
