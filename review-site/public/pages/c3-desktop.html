<style>
@keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
body{margin:0;background:#FFFFFF}
a{color:#0A7FD0}a:hover{color:#0866A8}
/* hero highlighter: a semi-transparent Sky Blue stroke drawn over the white type (normal blend, navy ground) */
.hlx{position:relative;font-style:normal}
.caret{animation:caretBlink 1s steps(1) infinite}
.caret.is-off{opacity:0;animation:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width: 960px){.nav-links{display:none !important}}
.hero-bg-kitchen,.hero-bg-office,.hero-bg-ecommerce{display:none}
[data-hero="kitchen"] .hero-bg-kitchen,[data-hero="office"] .hero-bg-office,[data-hero="ecommerce"] .hero-bg-ecommerce{display:block}
/* Review toggle: blue or green (#C1F432) solid buttons */
.tg-bar{height:40px;box-sizing:border-box;background:#141414;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:12px;font:500 12.5px/1 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:0}
.tg-bar .tg-label{color:#BDBDBD}
.tg-bar .tg-group{display:inline-flex;background:#2B2B2B;border-radius:999px;padding:3px;gap:2px}
.tg-bar .tg-opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;color:#D0D0D0;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;transition:background-color .2s ease,color .2s ease}
.tg-bar .tg-opt:hover{color:#FFFFFF}
.tg-bar .tg-opt:focus-visible{outline:2px solid #7CB8F0;outline-offset:2px}
.tg-bar .tg-opt[aria-pressed="true"]{background:#FFFFFF;color:#141414}
.tg-bar .tg-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
[data-btn="green"] .tg-btn{background:#C1F432 !important;color:#0A2240 !important;border-color:#C1F432 !important}
[data-btn="green"] .tg-btn{filter:none !important;transition:opacity .2s ease,background-color .2s ease,color .2s ease}
[data-btn="green"] .tg-btn:hover,[data-btn="green"] .tg-btn:focus-visible{background:#C1F432 !important;opacity:.9;filter:none !important}
[data-btn="green"] .tg-btn *{color:#0A2240 !important}
/* Hover pack (28 Oct) */
/* Buttons (28 Oct, revised by request): a 2px lift only, with no invert and no shadow */
.tg-btn,[data-btn] .tg-btn{transition:transform .4s cubic-bezier(.22,.61,.36,1),filter .4s ease,opacity .4s ease}
.tg-btn:hover,.tg-btn:focus-visible{transform:translateY(-2px)}
[data-btn="blue"] .tg-btn:hover,[data-btn="blue"] .tg-btn:focus-visible{filter:brightness(1.12)}
.hv-nav{transition:color .2s ease}
.hv-nav:hover,.hv-nav:focus-visible{color:#FFFFFF !important;text-decoration:underline !important;text-decoration-thickness:2px;text-underline-offset:6px}
.hv-foot{transition:color .2s ease}
.hv-foot:hover,.hv-foot:focus-visible{color:#7CC4F8 !important}
.hv-arrow svg{transition:transform .25s ease}
.hv-arrow:hover,.hv-arrow:focus-visible{text-decoration:underline !important;text-underline-offset:4px}
.hv-arrow:hover svg,.hv-arrow:focus-visible svg{transform:translateX(4px)}
/* Case study rows (28 Oct, by request): a lime wipe from left to right, clipped to the rounded panel; only the caret moves */
.hv-rows{overflow:hidden}
.hv-row{background:linear-gradient(#C1F432,#C1F432) no-repeat 0 0/0% 100%;transition:background-size .5s cubic-bezier(.22,.61,.36,1)}
.hv-row:hover,.hv-row:focus-visible{background-size:100% 100%}
.hv-row [style*="#0A7FD0"]{transition:color .35s ease}
.hv-row:hover [style*="#0A7FD0"],.hv-row:focus-visible [style*="#0A7FD0"]{color:#0A2240 !important}
.hv-row > span:last-child svg{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.hv-row:hover > span:last-child svg,.hv-row:focus-visible > span:last-child svg{transform:translateX(5px)}
/* Featured case study (28 Oct, by request): only the photo zooms, inside its own frame; the card and its gradient stay put */
.hv-feat-ph{overflow:hidden}
.hv-feat img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.hv-feat:hover .hv-feat-ph > img{transform:scale(1.04)}
.hv-card{transition:transform .3s ease,box-shadow .3s ease}
.hv-card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(10,34,64,.22)}
.hv-post img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.hv-post h3{transition:color .25s ease}
.hv-post:hover img{transform:scale(1.05)}
.hv-faq{transition:color .2s ease}
.hv-faq svg{transition:transform .25s ease}
.hv-faq:hover,.hv-faq:focus-visible{color:#0A7FD0 !important}
.hv-faq:hover svg{transform:rotate(90deg)}
.hv-circ{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.hv-circ:hover,.hv-circ:focus-visible{transform:translateY(-2px)}
.hv-ghost{transition:transform .4s cubic-bezier(.22,.61,.36,1)}
.hv-ghost:hover,.hv-ghost:focus-visible{transform:translateY(-2px)}
.hv-soc{transition:transform .25s ease,background-color .25s ease}
.hv-soc:hover,.hv-soc:focus-visible{transform:translateY(-3px) scale(1.06);background:#7CC4F8 !important}
.hv-fig{transition:transform .3s ease,box-shadow .3s ease}
.hv-fig:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(10,34,64,.3)}
/* Highlighter (28 Oct) */
/* "When people usually call us" cards: the same lime wipe as the case study rows; nothing moves */
.hv-cells{border-radius:18px;overflow:hidden}
.hv-cell{background:linear-gradient(#C1F432,#C1F432) no-repeat 0 0/0% 100% !important;transition:background-size .5s cubic-bezier(.22,.61,.36,1)}
.hv-cell:hover{background-size:100% 100% !important}
.hv-cell:hover h3{color:#0A2240 !important}
/* Highlighter (revised 28 Oct): a messy lime marker stroke, taller than the letters and running a little past both ends, drawn left to right;
   the letters turn navy only as the stroke reaches them (.hl-ink), so they never vanish on the dark sections */
.hl{position:relative;background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 40' preserveAspectRatio='none'><path fill='%23C1F432' fill-opacity='.55' d='M1 15C40 11 95 13 140 10S190 9 199 12L198 31C150 33 90 30 45 32S8 33 2 30C0 25 0 20 1 15Z'/><path fill='%23C1F432' fill-opacity='.95' d='M5 8C28 5 62 9 98 6S168 4 195 7C199 13 197 21 199 27S196 33 194 34C160 36 118 33 80 35S30 36 6 34C2 28 4 22 2 17S3 11 5 8Z'/></svg>");background-repeat:no-repeat;background-position:0 55%;background-size:0% 112%;-webkit-box-decoration-break:slice;box-decoration-break:slice;padding:0 .42em;margin:0 -.42em;text-decoration-color:currentColor;transition:background-size .55s cubic-bezier(.65,0,.35,1),text-decoration-color .3s ease}
a.hl:hover,a.hl:focus-visible,.hv-post:hover .hl{background-size:100% 112%;text-decoration-color:transparent !important}
.hl-ink{background-image:linear-gradient(90deg,#0A2240 50%,currentColor 50%);background-size:200% 100%;background-position:100% 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-box-decoration-break:slice;box-decoration-break:slice;transition:background-position .55s cubic-bezier(.65,0,.35,1) .04s}
a.hl:hover .hl-ink,a.hl:focus-visible .hl-ink,.hv-post:hover .hl-ink{background-position:0 0}
/* header fade: continues 96px below the header so it never ends in a hard line */
.hdr-fade::after{content:'';position:absolute;left:0;right:0;top:100%;height:96px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.22) 45%,rgba(0,0,0,0) 100%);pointer-events:none}
/* titles that wrap: the stroke is one continuous pass, across the first line and then on to the next (box-decoration-break: slice),
   so it runs a little longer and at a steadier pace */
.hv-post .hl{transition:background-size .95s cubic-bezier(.45,.05,.55,.95)}
.hv-post .hl-ink{transition:background-position .95s cubic-bezier(.45,.05,.55,.95) .05s}
a.hl:hover svg,a.hl:focus-visible svg{color:#0A2240 !important;transition:transform .25s ease,color .2s ease .4s}
.hv-post{cursor:pointer}
.hv-post:hover h3{color:#0A2240 !important}
@media (prefers-reduced-motion: reduce){.hl,.hl-ink,.hv-cell{transition:none !important}}
</style>

<script type="application/json" id="dc-props">{"primary":{"editor":"color","default":"#0A7FD0","options":["#0A7FD0","#0A2240","#0087C0","#111111"]},"$preview":{"width":1440,"height":8000}}</script>
<script src="../rt.js"></script>
<script>
class Component extends DCLogic {
  setBtn(v) {
    // the review toggle; boards of the same lane stay in step through a broadcast channel
    this.setState({ btn: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ btn: v }); } catch (e) {}
  }
  setHero(v) {
    // the hero background toggle (kitchen, office or ecommerce photo), shared with the other Lane C3 boards
    this.setState({ hero: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ hero: v }); } catch (e) {}
  }
  listenBtn() {
    try {
      this.btnChannel = new BroadcastChannel('mission-buttons-lane-c3');
      this.btnChannel.onmessage = (e) => {
        if (e.data && e.data.btn) this.setState({ btn: e.data.btn });
        if (e.data && e.data.hero) this.setState({ hero: e.data.hero });
      };
    } catch (e) {}
  }
  phrases() {
    return ["the messy work.", "the hard part.", "the backlog.", "the cleanup.", "the numbers."];
  }
  renderVals() {
    return {
      btnMode: (this.state && this.state.btn) || 'green',
      isBlue: ((this.state && this.state.btn) || 'green') === 'blue' ? 'true' : 'false',
      isGreen: ((this.state && this.state.btn) || 'green') === 'green' ? 'true' : 'false',
      setBlue: this.setBlue || (this.setBlue = () => this.setBtn('blue')),
      setGreen: this.setGreen || (this.setGreen = () => this.setBtn('green')),
      heroMode: (this.state && this.state.hero) || 'kitchen',
      isKitchen: ((this.state && this.state.hero) || 'kitchen') === 'kitchen' ? 'true' : 'false',
      isOffice: ((this.state && this.state.hero) || 'kitchen') === 'office' ? 'true' : 'false',
      setKitchen: this.setKitchen || (this.setKitchen = () => this.setHero('kitchen')),
      setOffice: this.setOffice || (this.setOffice = () => this.setHero('office')),
      isEcommerce: ((this.state && this.state.hero) || 'kitchen') === 'ecommerce' ? 'true' : 'false',
      setEcommerce: this.setEcommerce || (this.setEcommerce = () => this.setHero('ecommerce')),
      typed: (this.state && this.state.typed) ?? this.phrases()[0],
      caretCls: 'caret' + (((this.state && this.state.caret) ?? false) ? '' : ' is-off'),
      primary: this.props.primary ?? '#0A7FD0',
      setTrack: this.setTrack || (this.setTrack = (el) => { this.track = el; }),
      prev: this.prev || (this.prev = () => this.scrollCards(-1)),
      next: this.next || (this.next = () => this.scrollCards(1)),
    };
  }
  popHighlight(e) {
    const path = e.composedPath ? e.composedPath() : [];
    const hit = path.find((n) => n && n.classList && (n.classList.contains('hl') || n.classList.contains('hv-post')));
    if (!hit) return;
    const mark = hit.classList.contains('hl') ? hit : hit.querySelector('.hl');
    if (!mark || !mark.animate) return;
    mark.animate([{ backgroundSize: '100% 112%' }, { backgroundSize: '100% 150%', offset: 0.35 }, { backgroundSize: '100% 112%' }], { duration: 520, easing: 'ease-out' });
    mark.animate([{ transform: 'scale(1)' }, { transform: 'scale(0.96)', offset: 0.3 }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
    const doc = mark.ownerDocument;
    const colors = ['#C1F432', '#C1F432', '#0A7FD0', '#7CC4F8'];
    for (let i = 0; i < 12; i++) {
      const bit = doc.createElement('span');
      const size = 5 + Math.random() * 5;
      bit.style.cssText = 'position:fixed;left:' + e.clientX + 'px;top:' + e.clientY + 'px;width:' + size + 'px;height:' + size + 'px;margin:' + (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px;border-radius:' + (i % 3 ? '50%' : '2px') + ';background:' + colors[i % 4] + ';pointer-events:none;z-index:2147483647';
      doc.body.appendChild(bit);
      const a = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
      const d = 34 + Math.random() * 30;
      const fly = bit.animate([
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 12) + 'px) scale(0.4) rotate(' + (Math.random() * 240 - 120) + 'deg)', opacity: 0 }
      ], { duration: 650 + Math.random() * 250, easing: 'cubic-bezier(.22,.61,.36,1)' });
      fly.onfinish = () => bit.remove();
    }
  }
  componentDidMount() {
    this.listenBtn();
    // highlighter press and confetti on click (skipped for reduced motion)
    this.onHlClick = (e) => { if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) this.popHighlight(e); };
    document.addEventListener('click', this.onHlClick, true);
    // hero phrase: type it out, hide the cursor and hold, clear, then the next phrase.
    // reduced-motion users get the first phrase, still
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const PHRASES = this.phrases();
    let idx = 0;
    const later = (fn, ms) => { this.typeTimer = setTimeout(fn, ms); };
    const clear = () => {
      this.setState({ caret: true });
      let len = PHRASES[idx].length;
      const del = () => {
        len -= 1;
        this.setState({ typed: PHRASES[idx].slice(0, len) });
        if (len > 0) later(del, 35);
        else { idx = (idx + 1) % PHRASES.length; later(type, 350); }
      };
      later(del, 300);
    };
    const type = () => {
      let len = 0;
      const add = () => {
        len += 1;
        this.setState({ typed: PHRASES[idx].slice(0, len) });
        if (len < PHRASES[idx].length) later(add, 75);
        else { this.setState({ caret: false }); later(clear, 1800); }
      };
      add();
    };
    later(clear, 2200);
  }
  componentWillUnmount() {
    document.removeEventListener('click', this.onHlClick, true);
    try { if (this.btnChannel) this.btnChannel.close(); } catch (e) {}
    clearTimeout(this.typeTimer);
  }
  scrollCards(dir) {
    // one card plus its arrow per click
    if (this.track) this.track.scrollBy({ left: dir * 300, behavior: 'smooth' });
  }
}
DC.boot(Component);
</script>
