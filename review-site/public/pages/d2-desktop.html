body{margin:0;background:#F6F5F0}

/* Hover system: every link, button and form field responds */
a,button{transition:color .2s ease,background-color .2s ease,border-color .2s ease,filter .2s ease,opacity .2s ease}
a svg,button svg,a > span,button > span{transition:transform .25s cubic-bezier(.22,.8,.24,1)}

footer a.ld-cut-sm:is(:hover,:focus-visible,:active){background:#0E3A66 !important;border-color:#0E3A66 !important;color:#FFFFFF !important}
footer a.ld-cut-sm:is(:hover,:focus-visible,:active) svg{transform:translateY(-2px)}
button.ld-cut-sm:is(:hover,:focus-visible,:active){filter:brightness(1.12)}
header button.ld-cut-sm:is(:hover,:focus-visible,:active){border-color:#1E73BE !important;color:#1E73BE !important}
a:not([class]):is(:hover,:focus-visible,:active) > svg:last-child{transform:translateX(4px)}
nav a:not([class]):not([aria-label]):is(:hover,:focus-visible,:active){color:#1E73BE !important;text-decoration:underline !important;text-decoration-thickness:2px !important;text-underline-offset:8px !important}
footer a:not([class]):is(:hover,:focus-visible,:active){color:#1E73BE !important}

a[aria-label="MISSION home"]:is(:hover,:focus-visible,:active){opacity:.75}
button[aria-expanded]:is(:hover,:focus-visible,:active){color:#7CB8F0 !important}

.ld-row h3{transition:color .2s ease}
.ld-row:is(:hover,:focus-visible,:active) h3{color:#1E73BE !important}
.ld-row:is(:hover,:focus-visible,:active) > span:last-child{background:#1E73BE !important;border-color:#1E73BE !important;color:#FFFFFF !important;transform:translate(3px,-3px)}
.ld-post:is(:hover,:focus-visible,:active) h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
input:focus,textarea:focus{outline:none;border-bottom-color:#7CB8F0 !important}

@media (prefers-reduced-motion: reduce){a svg,button svg,a > span,button > span,.ld-row > span{transition:none !important;transform:none !important}}
/* Review toggle: blue or green (#C1F432) solid buttons */
.tg-bar{height:40px;box-sizing:border-box;background:#141414;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:12px;font:500 12.5px/1 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:0}

.tg-bar .tg-group{display:inline-flex;background:#2B2B2B;border-radius:999px;padding:3px;gap:2px}
.tg-bar .tg-opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;color:#D0D0D0;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;transition:background-color .2s ease,color .2s ease}
.tg-bar .tg-opt:hover{color:#FFFFFF}
.tg-bar .tg-opt:focus-visible{outline:2px solid #7CB8F0;outline-offset:2px}
.tg-bar .tg-opt[aria-pressed="true"]{background:#FFFFFF;color:#141414}
.tg-bar .tg-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
[data-btn="green"] .tg-btn{background:#C1F432 !important;color:#0E3A66 !important;border-color:#C1F432 !important}
[data-btn="green"] .tg-btn{filter:none !important;transition:opacity .2s ease,background-color .2s ease,color .2s ease}
[data-btn="green"] .tg-btn:hover,[data-btn="green"] .tg-btn:focus-visible{background:#C1F432 !important;opacity:.9;filter:none !important}
[data-btn="green"] .tg-btn *{color:#0E3A66 !important}
</style>

<p style="margin: 0; max-width: 520px; font-size: 15.5px; line-height: 1.6; color: #D6E6F5">If one of these is where you are right now, you're in the right place. It's how most of our clients arrived.</p>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
<li class="ld-cut-lg" style="display: flex; flex-direction: column; gap: 10px; padding: 24px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 0; backdrop-filter: blur(6px)"><span style="font-weight: 600; font-size: 15px; color: #7CB8F0">01</span><h3 style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; color: #FFFFFF">Our bookkeeper just left</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #D6E6F5">Retired, moved on, or turned out to be someone you couldn't rely on. We pick up the history, find what's missing and take over the month-end.</p></li>
<li class="ld-cut-lg" style="display: flex; flex-direction: column; gap: 10px; padding: 24px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 0; backdrop-filter: blur(6px)"><span style="font-weight: 600; font-size: 15px; color: #7CB8F0">02</span><h3 style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; color: #FFFFFF">We've lost confidence in our accountant</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #D6E6F5">Work that arrives late, wrong, or after three unanswered emails. We'll tell you honestly what state the books are in before anything else.</p></li>
<li class="ld-cut-lg" style="display: flex; flex-direction: column; gap: 10px; padding: 24px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 0; backdrop-filter: blur(6px)"><span style="font-weight: 600; font-size: 15px; color: #7CB8F0">03</span><h3 style="margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; color: #FFFFFF">We're months, or years, behind</h3><p style="margin: 0; font-size: 14px; line-height: 1.55; color: #D6E6F5">Accounts unreconciled to the point where nobody wants to open QuickBooks. Cleanup comes first, then the monthly work resumes.</p></li>

<script>
class Component extends DCLogic {
  setBtn(v) {
    // the review toggle; boards of the same lane stay in step through a broadcast channel
    this.setState({ btn: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ btn: v }); } catch (e) {}
  }
  listenBtn() {
    try {
      this.btnChannel = new BroadcastChannel('mission-buttons-lane-d2');
      this.btnChannel.onmessage = (e) => { if (e.data && e.data.btn) this.setState({ btn: e.data.btn }); };
    } catch (e) {}
  }
  renderVals() {
    return {
      btnMode: (this.state && this.state.btn) || 'green',
      isBlue: ((this.state && this.state.btn) || 'green') === 'blue' ? 'true' : 'false',
      isGreen: ((this.state && this.state.btn) || 'green') === 'green' ? 'true' : 'false',
      setBlue: this.setBlue || (this.setBlue = () => this.setBtn('blue')),
      setGreen: this.setGreen || (this.setGreen = () => this.setBtn('green')),
      primary: this.props.primary ?? '#1E73BE',
    };
  }
  componentDidMount() {
    this.listenBtn();
  }
  componentWillUnmount() {
    try { if (this.btnChannel) this.btnChannel.close(); } catch (e) {}
  }
}
DC.boot(Component);
</script>
