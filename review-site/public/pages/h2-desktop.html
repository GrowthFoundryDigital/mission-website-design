<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>MISSION homepage · Lane H2 · Desktop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&amp;family=Open+Sans:wght@400;600&amp;family=Caveat:wght@600&amp;display=swap">
<style>
body{margin:0;background:#101419}
.lh{font-family:'Open Sans','Helvetica Neue',Arial,sans-serif;color:#3A424D;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
.lh *{box-sizing:border-box}
.lh h1,.lh h2,.lh h3{margin:0;font-family:'Space Grotesk','Open Sans',sans-serif;font-weight:600;color:#101419;letter-spacing:-.025em;text-wrap:balance}
.lh p{margin:0}
.lh .dk{background:#101419;color:#B9C0CA}
.lh .dk h1,.lh .dk h2,.lh .dk h3{color:#FFFFFF}
.lh .bl{background:var(--eb);color:var(--eb-pale)}
.lh .bl h1,.lh .bl h2,.lh .bl h3{color:#FFFFFF}
.lh .ch{background:#F5F6F7}
.lh .wh{background:#FFFFFF}
.lh .eb{margin:0;display:flex;align-items:center;gap:14px;font:600 12px/1.3 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--eb)}
.lh .eb b{font-weight:600;color:#101419}
.lh .dk .eb{color:var(--eb-lt)}
.lh .dk .eb b{color:#FFFFFF}
.lh .bl .eb,.lh .bl .eb b{color:#FFFFFF}
.lh .bl .btn-o{color:#FFFFFF;border-color:rgba(255,255,255,.55)}
.lh .bl .btn-o:hover,.lh .bl .btn-o:focus-visible{border-color:#FFFFFF}
.lh .bl .btn-p{background:#101419}
.lh .bl .btn-p:hover,.lh .bl .btn-p:focus-visible{background:#000000}
.lh .bl .nav a{color:#FFFFFF}
.lh .bl .nav a:hover,.lh .bl .nav a:focus-visible{color:#FFFFFF}
.hero-bg-kitchen,.hero-bg-office,.hero-bg-ecommerce{display:none}
/* Hero divider review switch (28 Oct): off = the photo full width behind the text, no blue angle, no blue-side geometry */
.hero-fade,.hero-full{display:none}
.hero-full{position:absolute;inset:0;z-index:0;overflow:hidden}
[data-div="off"] .hero-ph{left:0 !important;clip-path:none !important}
[data-div="off"] .hero-fade{display:block}
[data-div="off"] .hero-script{left:1133px !important}
[data-div="off"] .hero-geo{display:none}
[data-div="off"] .hero-full{display:block}
[data-div="off"] .hero-band{clip-path:none !important}
[data-div="off"] .hero-band > img,[data-div="off"] .hero-band > .wedge{visibility:hidden}
[data-hero="kitchen"] .hero-bg-kitchen,[data-hero="office"] .hero-bg-office,[data-hero="ecommerce"] .hero-bg-ecommerce{display:block}
.lh .mu{color:#5E6670}
.lh .dk .mu{color:#9AA3AE}
.lh .bl .mu{color:var(--eb-pale)}
.lh .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:4px;border:1px solid transparent;font:600 15px/1 'Space Grotesk',sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .25s ease,color .25s ease,border-color .25s ease}
.lh .btn-p{background:var(--eb);color:#FFFFFF}
.lh .btn-p:hover,.lh .btn-p:focus-visible{background:#1B47CC}
.lh .btn-o{background:transparent;color:#101419;border-color:#C9CED6}
.lh .btn-o:hover,.lh .btn-o:focus-visible{border-color:#101419}
.lh .dk .btn-o{color:#FFFFFF;border-color:rgba(255,255,255,.3)}
.lh .dk .btn-o:hover,.lh .dk .btn-o:focus-visible{border-color:#FFFFFF}
.lh .btn-ghost{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.6)}
.lh .btn-ghost:hover,.lh .btn-ghost:focus-visible{background:rgba(255,255,255,.12);border-color:#FFFFFF}
.lh .btn-w{background:#FFFFFF;color:#101419}
.lh .btn-w:hover,.lh .btn-w:focus-visible{background:var(--eb-tint2)}
.lh .lk{display:inline-flex;align-items:center;gap:8px;font:600 14.5px/1.3 'Space Grotesk',sans-serif;color:var(--eb);text-decoration:none}
.lh .dk .lk{color:#FFFFFF}
.lh .lk .ar,.lh .btn .ar{transition:transform .25s ease}
.lh .lk:hover .ar,.lh .btn:hover .ar,.lh a:hover .lk .ar{transform:translateX(3px)}
.lh .nav a{color:#C3C9D2;text-decoration:none;font-size:14px;font-weight:600;transition:color .2s ease}
.lh .nav a:hover,.lh .nav a:focus-visible{color:#FFFFFF}
.lh .ph{position:relative;overflow:hidden;background:#1B2029}
.lh .ph img{display:block;width:100%;height:100%;object-fit:cover}
.lh .dots{background-image:radial-gradient(#8FA3C8 1.3px,transparent 1.4px);background-size:16px 16px}
.lh .dk .dots,.lh .dots.on-dk{background-image:radial-gradient(rgba(255,255,255,.28) 1.3px,transparent 1.4px)}
.lh .wedge{clip-path:polygon(0 0,100% 0,62% 100%,0 100%)}
.lh .ic{display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--eb)}
.lh .dk .ic{color:var(--eb-lt)}
.lh .card{background:#FFFFFF;border:1px solid #E2E5EA;border-radius:6px;transition:border-color .25s ease,transform .25s ease}
.lh a.card{text-decoration:none;color:inherit;display:flex}
.lh a.card:hover,.lh a.card:focus-visible{border-color:var(--eb);transform:translateY(-3px)}
.lh .tag{font:600 11.5px/1.3 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--eb)}
.lh .dk .tag{color:var(--eb-lt)}
.lh .faq{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-top:1px solid #DDE1E6;cursor:pointer;font:600 17px/1.35 'Space Grotesk',sans-serif;color:#101419}
.lh .faq svg{color:var(--eb);flex:none;transition:transform .25s ease}
.lh .faq[aria-expanded="true"] svg{transform:rotate(45deg)}
.lh .foot a{color:#AEB5BF;text-decoration:none;font-size:13.5px;transition:color .3s ease}
/* footer text links turn lime on hover (28 Oct, by request); the footer's buttons keep their own hovers */
.lh .foot a:not(.btn):hover,.lh .foot a:not(.btn):focus-visible{color:#C1F432 !important}
.lh .foot .fh{margin:0 0 6px;font:600 11.5px/1.3 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--eb-lt)}
.lh .foot input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid rgba(255,255,255,.2);border-radius:4px;background:rgba(255,255,255,.05);font:400 14px/1 'Open Sans',sans-serif;color:#FFFFFF}
.lh .foot input::placeholder{color:#7D8692}
.lh .foot input:focus{outline:none;border-color:var(--eb-lt)}
.lh .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lh .script{font-family:'Caveat',cursive;font-weight:600;color:#FFFFFF;line-height:.95}
/* Geometry: decorative shapes sit behind content (z 0); section content sits above (z 1) */
.lh section,.lh footer{position:relative;overflow:hidden}
.lh section > *:not(.deco),.lh footer > *:not(.deco){position:relative;z-index:1}
.lh .deco{position:absolute;pointer-events:none;z-index:0}
.lh .dots.blue{background-image:radial-gradient(var(--eb) 1.4px,transparent 1.5px);opacity:.35}
@media (prefers-reduced-motion: reduce){.lh *{transition:none !important}}
/* Review toggle: blue (var(--eb)) or green (#C1F432) solid buttons */
.tg-bar{min-height:40px;box-sizing:border-box;background:#141414;color:#FFFFFF;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:6px 8px;font:500 12.5px/1 system-ui,-apple-system,'Segoe UI',sans-serif}
.tg-bar .tg-label{color:#BDBDBD}
.tg-bar .tg-group{display:inline-flex;background:#2B2B2B;border-radius:999px;padding:3px;gap:2px}
.tg-bar .tg-opt{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;color:#D0D0D0;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;transition:background-color .2s ease,color .2s ease}
.tg-bar .tg-opt:hover{color:#FFFFFF}
.tg-bar .tg-opt:focus-visible{outline:2px solid var(--eb-lt);outline-offset:2px}
.tg-bar .tg-opt[aria-pressed="true"]{background:#FFFFFF;color:#141414}
.tg-bar .tg-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
[data-btn="green"] .tg-btn{background:#C1F432 !important;color:#101419 !important;border-color:#C1F432 !important}
[data-btn="green"] .tg-btn:hover,[data-btn="green"] .tg-btn:focus-visible{opacity:1}
/* Hovers (28 Oct): every button turns lime; cards lift */
.lh .btn{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .25s ease,box-shadow .25s ease}
.lh .btn:hover,.lh .btn:focus-visible,[data-btn="green"] .lh .btn:hover,[data-btn="green"].lh .btn:hover,[data-btn="green"].lh .btn:focus-visible{background:#C1F432 !important;color:#101419 !important;border-color:#C1F432 !important;transform:translateY(-2px);box-shadow:0 10px 24px rgba(193,244,50,.28)}
.lh .btn:hover *,.lh .btn:focus-visible *{color:#101419 !important}
.lh .card{transition:border-color .3s ease,transform .3s ease,box-shadow .3s ease}
.lh .card:hover,.lh a.card:focus-visible{border-color:var(--eb) !important;transform:translateY(-4px);box-shadow:0 18px 40px rgba(16,20,25,.10)}
.lh .feat{transition:transform .3s ease,box-shadow .3s ease}
.lh .feat img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lh .feat:hover,.lh .feat:focus-visible{transform:translateY(-4px);box-shadow:0 24px 50px rgba(16,20,25,.22)}
.lh .feat:hover img,.lh .feat:focus-visible img{transform:scale(1.04)}
.lh .qcard{transition:transform .3s ease,box-shadow .3s ease,background-color .3s ease}
.lh .qcard:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(0,0,0,.35)}
.lh .qcard:not([style*="var(--eb)"]):hover{background:#222833 !important}
.lh .post .ph img{transition:transform .6s cubic-bezier(.22,.61,.36,1)}
.lh .post h3{transition:color .25s ease}
.lh .post:hover .ph img{transform:scale(1.05)}
.lh .post:hover h3{color:var(--eb)}
/* Hover pack (28 Oct): FAQ, trigger rows, support items, dark list rows */
.lh .faq{transition:color .2s ease}
.lh .faq:hover,.lh .faq:focus-visible{color:var(--eb)}
.lh .faq:hover svg{transform:rotate(90deg)}
.lh .faq[aria-expanded="true"]:hover svg{transform:rotate(45deg)}
.lh .hv-row{transition:transform .25s ease}
.lh .hv-row .ic{transition:transform .25s ease}
.lh .hv-row:hover{transform:translateX(8px)}
.lh .hv-row:hover .ic{transform:scale(1.15)}
.lh .hv-row:hover h3{color:var(--eb)}
/* Industries rows (28 Oct, by request): a lime wipe from left to right, reaching 24px past the text on both sides, square corners;
   only the fill moves, nothing inside the row */
.lh .hv-ind{position:relative;isolation:isolate}
.lh .hv-ind::before{content:'';position:absolute;top:0;bottom:0;left:-24px;right:-24px;z-index:-1;background:#C1F432;transform:scaleX(0);transform-origin:left center;transition:transform .5s cubic-bezier(.22,.61,.36,1);pointer-events:none}
.lh .hv-ind:hover::before{transform:scaleX(1)}
@media (max-width: 600px){.lh .hv-ind::before{left:-14px;right:-14px}}
@media (prefers-reduced-motion: reduce){.lh .hv-ind::before{transition:none}}
.lh .hv-sup{transition:border-color .25s ease,transform .25s ease}
/* support items: icons sit at the left edge, in line with the titles (28 Oct, by request) */
.lh .hv-sup > .ic{align-self:flex-start}
.lh .hv-sup:hover{border-top-color:var(--eb) !important;transform:translateY(-3px)}
.lh .hv-sup:hover h3{color:var(--eb)}
.lh .hv-li{transition:border-color .25s ease,color .25s ease}
.lh .hv-li .ic{transition:transform .25s ease}
.lh .hv-li:hover{border-top-color:#C1F432 !important}
.lh .hv-li:hover .ic{transform:translateX(4px);color:#C1F432}
.lh h3{transition:color .25s ease}
/* Buttons ease over 0.4s (28 Oct, by request) */
.lh .btn,[data-btn] .lh .tg-btn,[data-btn].lh .tg-btn{transition:transform .4s cubic-bezier(.22,.61,.36,1),background-color .4s ease,color .4s ease,border-color .4s ease,box-shadow .4s ease,filter .4s ease,opacity .4s ease !important}
.lh .btn .ar{transition:transform .4s cubic-bezier(.22,.61,.36,1) !important}
/* Text links (28 Oct, by request): a square lime wipe behind the words, left to right, reaching 8px past each end; the words ink to
   near-black as the lime reaches them (.lk-ink), and the arrow follows. Links inside a card fire when the card is hovered */
.lh .lk{position:relative;isolation:isolate;width:fit-content;max-width:100%}
.lh .lk::before{content:'';position:absolute;top:-5px;bottom:-5px;left:-8px;right:-8px;z-index:-1;background:#C1F432;transform:scaleX(0);transform-origin:left center;transition:transform .45s cubic-bezier(.22,.61,.36,1);pointer-events:none}
.lh a.lk:hover::before,.lh a.lk:focus-visible::before,.lh a:hover .lk::before,.lh a:focus-visible .lk::before{transform:scaleX(1)}
.lh .lk-ink{background-image:linear-gradient(90deg,#101419 50%,currentColor 50%);background-size:200% 100%;background-position:100% 0;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:background-position .45s cubic-bezier(.22,.61,.36,1) .03s}
.lh a.lk:hover .lk-ink,.lh a.lk:focus-visible .lk-ink,.lh a:hover .lk .lk-ink,.lh a:focus-visible .lk .lk-ink{background-position:0 0}
.lh .lk .ar{transition:transform .4s cubic-bezier(.22,.61,.36,1),color .15s ease .3s !important}
.lh a.lk:hover .ar,.lh a.lk:focus-visible .ar,.lh a:hover .lk .ar,.lh a:focus-visible .lk .ar{color:#101419}
@media (prefers-reduced-motion: reduce){.lh .lk::before,.lh .lk-ink{transition:none}}
[data-btn="green"] .tg-btn *{color:#101419 !important}
/* Black buttons (29 Oct): near-black everywhere; a light outline keeps them visible on the dark footer */
[data-btn="black"] .tg-btn{background:#101419 !important;color:#FFFFFF !important;border-color:#101419 !important}
[data-btn="black"] .tg-btn *{color:#FFFFFF !important}
[data-btn="black"] .foot .tg-btn{border-color:rgba(255,255,255,.45) !important}
[data-btn="black"] .tg-btn:hover *,[data-btn="black"] .tg-btn:focus-visible *{color:#101419 !important}
.lh .foot a.btn-p{color:#FFFFFF}
/* Blue buttons (29 Oct): blue everywhere; on blue backgrounds a darker shade of the same blue so they stay visible */
[data-btn="blue"] .tg-btn{background:var(--eb) !important;color:#FFFFFF !important;border-color:var(--eb) !important}
[data-btn="blue"] .tg-btn *{color:#FFFFFF !important}
[data-btn="blue"] .bl .tg-btn,[data-btn="blue"] .bl-band .tg-btn{background:var(--eb-dk) !important;border-color:var(--eb-dk) !important}
[data-btn="blue"][data-div="off"] .bl .tg-btn{background:var(--eb) !important;border-color:var(--eb) !important}
[data-btn="blue"] .tg-btn:hover *,[data-btn="blue"] .tg-btn:focus-visible *{color:#101419 !important}
.lh[data-btn="blue"] .tg-btn.btn:hover,.lh[data-btn="blue"] .tg-btn.btn:focus-visible{background:#C1F432 !important;border-color:#C1F432 !important;color:#101419 !important}
/* brand blue tokens */
.lh{--eb:#2459F5;--eb-lt:#8FAEFF;--eb-pale:#DCE5FF;--eb-mist:#EEF2FF;--eb-tint:#EEF2FE;--eb-tint2:#E8EEFF;--eb-dk:#1A3FB8}
.lh[data-blue="mission"]{--eb:#0087C0;--eb-lt:#7CC8EB;--eb-pale:#D2EDF8;--eb-mist:#EAF6FB;--eb-tint:#E7F4FA;--eb-tint2:#E0F1F9;--eb-dk:#00648F}
</style>

<style>html,body{margin:0;overflow-x:hidden}#dc-root{overflow-x:clip}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl"><div data-btn="{{ btnMode }}" data-hero="{{ heroMode }}" data-div="{{ divMode }}" data-blue="{{ blueMode }}" class="lh" style="width: 1440px; background: #101419">
<div class="tg-bar" aria-label="Review control, not part of the design">
<span class="tg-label">Review · button color</span>
<div class="tg-group" role="group" aria-label="Button color">
<button type="button" class="tg-opt" aria-pressed="{{ isBlue }}" onClick="{{ setBlue }}"><span class="tg-dot" style="background: var(--eb)"></span>Blue</button>
<button type="button" class="tg-opt" aria-pressed="{{ isGreen }}" onClick="{{ setGreen }}"><span class="tg-dot" style="background: #C1F432"></span>Green #C1F432</button>
<button type="button" class="tg-opt" aria-pressed="{{ isBlack }}" onClick="{{ setBlack }}"><span class="tg-dot" style="background: #101419; box-shadow: 0 0 0 1px rgba(255,255,255,.55)"></span>Black</button>
</div>
<span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Hero</span><span class="tg-group" role="group" aria-label="Hero background">
<button type="button" class="tg-opt" aria-pressed="{{ isKitchen }}" onClick="{{ setKitchen }}">Kitchen</button>
<button type="button" class="tg-opt" aria-pressed="{{ isOffice }}" onClick="{{ setOffice }}">Office</button>
<button type="button" class="tg-opt" aria-pressed="{{ isEcommerce }}" onClick="{{ setEcommerce }}">Ecommerce</button>
</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Divider</span><span class="tg-group" role="group" aria-label="Hero divider">
<button type="button" class="tg-opt" aria-pressed="{{ isDivOn }}" onClick="{{ setDivOn }}">On</button>
<button type="button" class="tg-opt" aria-pressed="{{ isDivOff }}" onClick="{{ setDivOff }}">Off</button>
</span></span>
<span style="display: inline-flex; align-items: center; gap: 8px"><span class="tg-label">Blue</span><span class="tg-group" role="group" aria-label="Brand blue">
<button type="button" class="tg-opt" aria-pressed="{{ isElectric }}" onClick="{{ setElectric }}"><span class="tg-dot" style="background: #2459F5"></span>Electric</button>
<button type="button" class="tg-opt" aria-pressed="{{ isMission }}" onClick="{{ setMission }}"><span class="tg-dot" style="background: #0087C0"></span>Mission</button>
</span></span>
</div>

<!-- 01 Hero: Electric Blue on the left, a photo on the right (kitchen, office or ecommerce, chosen in the review bar), three core services along the bottom -->
<section class="bl" style="position: relative; overflow: hidden">
<div class="hero-ph" aria-hidden="true" style="position: absolute; top: 0; left: 40%; right: 0; bottom: 101px; clip-path: polygon(43.3% 0, 100% 0, 100% 100%, 18.3% 100%)">
<img class="hero-bg-kitchen" src="../img/2066a54da13614d9c2246994e32d1902.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 40%">
<img class="hero-bg-office" src="../img/c76296e63f1cbdfd3cc1859696beddca.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 30%">
<img class="hero-bg-ecommerce" src="../img/b70d1fd6eb5a9839c3acd3ccea5d44a1.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 66% 38%">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 184px; background: linear-gradient(180deg, rgba(16, 20, 25, .9) 0%, rgba(16, 20, 25, .8) 44px, rgba(16, 20, 25, .55) 88px, rgba(16, 20, 25, .24) 131px, rgba(16, 20, 25, 0) 184px)"></div>
<div class="hero-fade" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16, 20, 25, .9) 0%, rgba(16, 20, 25, .78) 30%, rgba(16, 20, 25, .4) 52%, rgba(16, 20, 25, 0) 70%)"></div>
</div>
<div class="hero-geo">
<div class="deco dots on-dk" aria-hidden="true" style="left: 28px; top: 150px; width: 112px; height: 288px"></div>
<svg class="deco" aria-hidden="true" width="112" height="112" viewBox="0 0 112 112" style="left: -34px; top: 628px; opacity: 0.7; transform: rotate(-8deg); filter: blur(6px)"><polygon points="0,0 112,0 67.2,112 0,112" fill="#101419"></polygon></svg>
<svg class="deco" aria-hidden="true" width="54" height="54" viewBox="0 0 54 54" style="left: 98px; top: 546px; opacity: 1; transform: rotate(12deg)"><polygon points="11.88,0 54,0 54,54 0,54" fill="#101419"></polygon></svg>
<svg class="deco" aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" style="left: 36px; top: 468px; opacity: 0.85; transform: rotate(-18deg); filter: blur(2.5px)"><polygon points="0,0 27.28,0 44,44 0,44" fill="#101419"></polygon></svg>
<svg class="deco" aria-hidden="true" width="150" height="150" viewBox="0 0 150 150" style="left: 318px; top: 714px; opacity: 0.6; transform: rotate(10deg); filter: blur(14px)"><polygon points="0,0 150,0 150,150 57,150" fill="var(--eb-dk)"></polygon></svg>
<svg class="deco" aria-hidden="true" width="30" height="30" viewBox="0 0 30 30" style="left: 522px; top: 724px; opacity: 1; transform: rotate(22deg)"><polygon points="0,0 30,0 18,30 0,30" fill="#101419"></polygon></svg>

<script>

  setBtn(v) {
    // the review toggle; boards of the same lane stay in step through a broadcast channel
    this.setState({ btn: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ btn: v }); } catch (e) {}
  }
  setBrand(v) {
    // the brand blue switch (Electric or Mission), shared with the other Lane H2 board
    this.setState({ blue: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ blue: v }); } catch (e) {}

    // the hero divider switch (on or off), shared with the other Lane H2 board
    this.setState({ div: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ div: v }); } catch (e) {}

    this.setState({ hero: v });
    try { if (this.btnChannel) this.btnChannel.postMessage({ hero: v }); } catch (e) {}
  }
  listenBtn() {
    try {
      this.btnChannel = new BroadcastChannel('mission-buttons-lane-h2');
      this.btnChannel.onmessage = (e) => {
        if (e.data && e.data.btn) this.setState({ btn: e.data.btn });
        if (e.data && e.data.hero) this.setState({ hero: e.data.hero });
        if (e.data && e.data.div) this.setState({ div: e.data.div });
        if (e.data && e.data.blue) this.setState({ blue: e.data.blue });
      };

      heroMode: (this.state && this.state.hero) || 'kitchen',

      isOffice: ((this.state && this.state.hero) || 'kitchen') === 'office' ? 'true' : 'false',

      setEcommerce: this.setEcommerce || (this.setEcommerce = () => this.setHero('ecommerce')),
      divMode: (this.state && this.state.div) || 'on',

      setDivOn: this.setDivOn || (this.setDivOn = () => this.setDiv('on')),

      blueMode: (this.state && this.state.blue) || 'electric',
